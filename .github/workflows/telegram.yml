name: Publicar no Telegram

# O GitHub roda agendamentos em UTC e pode atrasar alguns minutos. O horário de cada post
# está na fila em horário de Brasília; o script decide o que já venceu.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: python3 ferramentas/testes.py
      - name: Publicar posts que venceram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: python3 ferramentas/telegram_publicar.py
      - name: Registrar o que saiu (evita publicar duas vezes)
        if: always()
        run: |
          if [ -n "$(git status --porcelain conteudo/publicados)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add conteudo/publicados
            git commit -m "Telegram: registra posts publicados"
            git push
          fi
