name: Publicar no Telegram

# O GitHub roda agendamentos em UTC e não garante horário. Medido de 25 a 28/09/2026: em
# vez de a cada 15 minutos, rodou com intervalos de 2,5 a 6 horas. Por isso o post fica
# na fila às 18:00 e a JANELA do script é de 8 horas. O horário de cada post está na fila
# em horário de Brasília; o script decide o que já venceu.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      verificar:
        description: "Só conferir token, canal e permissão do bot (não publica nada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: python3 ferramentas/testes.py
      - name: Conferir token e canal (sem publicar)
        if: ${{ inputs.verificar }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: python3 ferramentas/telegram_publicar.py --verificar
      - name: Publicar posts que venceram
        if: ${{ !inputs.verificar }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: python3 ferramentas/telegram_publicar.py
      - name: Registrar o que saiu (evita publicar duas vezes)
        if: ${{ always() && !inputs.verificar }}
        run: |
          if [ -n "$(git status --porcelain conteudo/publicados)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add conteudo/publicados
            git commit -m "Telegram: registra posts publicados"
            git push
          fi
