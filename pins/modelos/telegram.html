<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..900,0..100&family=Nunito+Sans:opsz,wght@6..12,600..900&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #2b2521;
    --creme: #fff6ea;
    --areia: #f3e1cf;
    --terracota: #c8553d;
    --suave: #7a6a5f;
    --tg: #2aa1da;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; background: var(--creme); }
  body { position: relative; font-family: 'Nunito Sans', sans-serif; color: var(--tinta); }

  /* vitrine 2 x 2 com fotos reais dos achadinhos; foto de loja vem com fundo branco */
  .vitrine {
    position: absolute; top: 0; left: 0; right: 0; height: 860px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px;
    background: var(--areia); padding: 10px;
  }
  .vitrine div { background: #fff center / contain no-repeat; border-radius: 26px; }
  .painel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 690px;
    background: var(--creme);
    border-radius: 56px 56px 0 0;
    padding: 96px 76px 0;
    box-shadow: 0 -18px 40px rgba(60, 30, 15, .08);
  }
  .selo {
    position: absolute; top: -84px; right: 76px;
    width: 168px; height: 168px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--tg);
    box-shadow: 0 12px 34px rgba(20, 60, 90, .25);
    border: 8px solid var(--creme);
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 800;
    font-size: ${tam_titulo}px; line-height: 1.03; letter-spacing: -.012em;
    font-variation-settings: 'SOFT' 100;
    max-width: 820px;
  }
  .sub { margin-top: 24px; font-size: 38px; line-height: 1.3; font-weight: 600; color: var(--suave); max-width: 820px; }
  .botao {
    display: inline-block; margin-top: 40px; padding: 22px 46px; border-radius: 999px;
    background: var(--tg); color: #fff; font-weight: 900; font-size: 36px;
  }
  .marca {
    position: absolute; left: 76px; right: 76px; bottom: 54px;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 800; font-size: 28px;
  }
  .marca .nome { display: flex; align-items: center; gap: 14px; }
  .marca .gratis { color: var(--suave); font-weight: 700; font-size: 26px; }
</style>
</head>
<body>
  <div class="vitrine">
    <div style="background-image: url('${foto1}')"></div>
    <div style="background-image: url('${foto2}')"></div>
    <div style="background-image: url('${foto3}')"></div>
    <div style="background-image: url('${foto4}')"></div>
  </div>
  <div class="painel">
    <div class="selo">
      <svg width="96" height="96" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M11 23.4 34.6 14c1.1-.4 2 .3 1.7 1.9l-4 18.9c-.3 1.3-1.1 1.7-2.2 1l-6-4.4-2.9 2.8c-.3.3-.6.6-1.2.6l.4-6.1 11.1-10c.5-.4-.1-.7-.7-.3l-13.7 8.6-5.9-1.8c-1.3-.4-1.3-1.3.3-1.8z" fill="#fff"/>
      </svg>
    </div>
    <h1>${titulo}</h1>
    <p class="sub">${subtitulo}</p>
    <span class="botao">Entrar no canal</span>
  </div>
  <div class="marca">
    <span class="nome">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <path d="M6 20 L22 7 L38 20 V37 a3 3 0 0 1 -3 3 H9 a3 3 0 0 1 -3 -3 Z" fill="#c8553d"/>
        <path d="M22 33 c-5 -3.6 -8 -6.2 -8 -9.4 a4 4 0 0 1 8 -1.4 a4 4 0 0 1 8 1.4 c0 3.2 -3 5.8 -8 9.4 Z" fill="#fff6ea"/>
      </svg>
      Achadinhos pra Casa
    </span>
    <span class="gratis">grátis · sai quando quiser</span>
  </div>
</body>
</html>
