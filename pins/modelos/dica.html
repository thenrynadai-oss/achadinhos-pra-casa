<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..900,0..100&family=Nunito+Sans:opsz,wght@6..12,600..900&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #2b2521;
    --creme: #fff6ea;
    --areia: #f3e1cf;
    --terracota: #c8553d;
    --salvia: #6f9476;
    --suave: #7a6a5f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; background: var(--creme); }
  body { position: relative; font-family: 'Nunito Sans', sans-serif; color: var(--tinta); }

  .foto {
    position: absolute; top: 0; left: 0; right: 0; height: 900px;
    background: #d9cfc3 url('${foto_url}') center / cover no-repeat;
  }
  .painel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 680px;
    background: var(--creme);
    border-radius: 56px 56px 0 0;
    padding: 72px 76px 0;
  }
  .numero {
    position: absolute; top: -84px; right: 76px;
    width: 168px; height: 168px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--terracota); color: #fff;
    font-family: 'Fraunces', serif; font-weight: 900; font-size: 104px; line-height: 1;
    font-variation-settings: 'SOFT' 100;
    box-shadow: 0 12px 34px rgba(60, 30, 15, .22);
    border: 8px solid var(--creme);
  }
  .sem-numero .numero { display: none; }
  .chip {
    display: inline-block;
    padding: 11px 24px; border-radius: 999px;
    background: var(--areia); color: var(--terracota);
    font-weight: 900; font-size: 26px; letter-spacing: .16em; text-transform: uppercase;
  }
  h1 {
    margin-top: 30px;
    font-family: 'Fraunces', serif; font-weight: 800;
    font-size: ${tam_titulo}px; line-height: 1.03; letter-spacing: -.012em;
    font-variation-settings: 'SOFT' 100;
    max-width: 820px;
  }
  .sub { margin-top: 24px; font-size: 38px; line-height: 1.3; font-weight: 600; color: var(--suave); max-width: 800px; }
  .marca {
    position: absolute; left: 76px; right: 76px; bottom: 54px;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 800; font-size: 28px;
  }
  .marca .nome { display: flex; align-items: center; gap: 14px; }
  .marca .salve { color: var(--suave); font-weight: 700; font-size: 26px; }
</style>
</head>
<body class="${classe_numero}">
  <div class="foto"></div>
  <div class="painel">
    <div class="numero">${numero}</div>
    <span class="chip">${categoria}</span>
    <h1>${titulo}</h1>
    <p class="sub">${subtitulo}</p>
  </div>
  <div class="marca">
    <span class="nome">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <path d="M6 20 L22 7 L38 20 V37 a3 3 0 0 1 -3 3 H9 a3 3 0 0 1 -3 -3 Z" fill="#c8553d"/>
        <path d="M22 33 c-5 -3.6 -8 -6.2 -8 -9.4 a4 4 0 0 1 8 -1.4 a4 4 0 0 1 8 1.4 c0 3.2 -3 5.8 -8 9.4 Z" fill="#fff6ea"/>
      </svg>
      Achadinhos pra Casa
    </span>
    <span class="salve">salve pra depois</span>
  </div>
</body>
</html>
